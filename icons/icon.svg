<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1117"/>
      <stop offset="100%" stop-color="#0e1a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Open book body -->
  <rect x="96" y="168" width="148" height="192" rx="10" fill="url(#accent)" opacity="0.9"/>
  <rect x="268" y="168" width="148" height="192" rx="10" fill="url(#accent)" opacity="0.7"/>

  <!-- Spine -->
  <rect x="244" y="160" width="24" height="208" rx="4" fill="#0891b2"/>

  <!-- Page lines left -->
  <line x1="118" y1="218" x2="226" y2="218" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <line x1="118" y1="248" x2="226" y2="248" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <line x1="118" y1="278" x2="226" y2="278" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <line x1="118" y1="308" x2="200" y2="308" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

  <!-- Page lines right -->
  <line x1="286" y1="218" x2="394" y2="218" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.4"/>
  <line x1="286" y1="248" x2="394" y2="248" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.4"/>
  <line x1="286" y1="278" x2="394" y2="278" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.4"/>
  <line x1="286" y1="308" x2="360" y2="308" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.4"/>

  <!-- Checkmark circle -->
  <circle cx="256" cy="400" r="48" fill="#0891b2"/>
  <polyline points="234,400 249,415 278,386" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
